plugins { id 'com.android.application' }

android {
    namespace 'com.openai.workouttracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmed.workouttracker.video'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
