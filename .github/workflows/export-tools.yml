name: Export Android Tools
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Pack tools
        run: |
          mkdir -p exported-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" exported-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" exported-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" exported-tools/\n          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" exported-tools/ || true
          chmod +x exported-tools/zipalign exported-tools/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: exported-tools
          if-no-files-found: error
